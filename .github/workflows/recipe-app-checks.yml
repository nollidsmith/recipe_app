name: PantryPilot checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: recipe-app-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  procedure:
    name: procedure checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run procedure gates for pull requests
        if: github.event_name == 'pull_request'
        env:
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: CI_PROJECT_PREFIX=recipe_app CI_PLACEHOLDER_ALLOW=recipe_app/.placeholder-allow sh recipe_app/scripts/ci-pr-checks.sh "$TARGET_SHA" "$HEAD_SHA"

      - name: Run procedure gates for pushes
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: CI_PROJECT_PREFIX=recipe_app CI_PLACEHOLDER_ALLOW=recipe_app/.placeholder-allow sh recipe_app/scripts/ci-checks.sh "$(sh recipe_app/scripts/ci-base.sh "$BEFORE_SHA")" "$HEAD_SHA"

  app:
    name: typecheck, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: recipe_app
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Show Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
